<svg width="1000" height="12" viewBox="0 0 1000 12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c0d40"/>
      <stop offset="50%" stop-color="#702fff"/>
      <stop offset="100%" stop-color="#1c0d40"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-500%" width="300%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-500%" width="300%" height="1100%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Línea base -->
  <rect
    x="0"
    y="4"
    width="1000"
    height="4"
    rx="2"
    fill="#1c0d40"
  />

  <!-- Glow general -->
  <rect
    x="0"
    y="4"
    width="1000"
    height="4"
    rx="2"
    fill="#702fff"
    opacity="0.25"
    filter="url(#softGlow)"
  />

  <!-- Luz LED -->
  <rect
    x="-120"
    y="3"
    width="120"
    height="6"
    rx="3"
    fill="url(#line)"
    filter="url(#glow)"
  >
    <animate
      attributeName="x"
      values="-120;1000;-120"
      dur="3s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
    />
  </rect>
</svg>
